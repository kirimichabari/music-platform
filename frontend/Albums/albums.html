<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albums - MusicHub</title>
    <link rel="stylesheet" href="albums.css">
</head>
<body>

    <nav>
        <h1>MusicHub</h1>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../Songs/songs.html">Songs</a></li>
            <li><a href="../Artists/artists.html">Artists</a></li>
            <li><a href="../Albums/albums.html">Albums</a></li>
            <li><a href="../Playlists/playlists.html">Playlists</a></li>
            <li><a href="../dashboard.html">Dashboard</a></li>
        </ul>
    </nav>

    <h1>All Albums</h1>

    <form id="album-form">

        <input
            type="text"
            id="title"
            placeholder="Album Title"
            required
        >

        <input
            type="date"
            id="release_date"
            required
        >

        <select id="artist_id" required>
            <option value="">Select Artist</option>
        </select>

        <button type="submit" id="submit-btn">
            Add Album
        </button>

    </form>

    <div id="albums-container"></div>

    <!-- Shared authentication functions -->
    <script src="../js/auth.js"></script>

    <!-- Albums functionality -->
    <script src="albums.js"></script>

</body>
</html>
