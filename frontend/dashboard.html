<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusicHub Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">
            <h1>MusicHub</h1>
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="Songs/songs.html">Songs</a>
            </li>

            <li>
                <a href="Albums/albums.html">Albums</a>
            </li>

            <li>
                <a href="Artists/artists.html">Artists</a>
            </li>

            <li>
                <a href="Playlists/playlists.html">Playlists</a>
            </li>

            <li>
                <a href="profile.html">Profile</a>
            </li>

        </ul>

        <input
            type="text"
            placeholder="Search songs, artists..."
            class="search-bar"
            id="search-bar"
        >

    </nav>


    <!-- Hero -->
    <section class="hero">

        <h2>Welcome Back</h2>

        <p>
            Enjoy unlimited music from your favourite artists.
        </p>

        <button id="start-listening-btn">
            Start Listening
        </button>

    </section>


    <!-- Trending Songs -->
    <section class="songs">

        <div class="section-title">
            <h2>Trending Songs</h2>
        </div>

        <div
            class="song-container"
            id="trending-songs-container"
        >

            <p>Loading songs...</p>

        </div>

    </section>


    <!-- New Albums -->
    <section class="albums">

        <div class="section-title">
            <h2>New Albums</h2>
        </div>

        <div
            class="album-container"
            id="new-albums-container"
        >

            <p>Loading albums...</p>

        </div>

    </section>


    <!-- Music Player -->
    <footer class="music-player">

        <div class="player-song">

            <strong id="player-song-title">
                No song playing
            </strong>

            <br>

            <small id="player-song-artist">
                Select a song to play
            </small>

        </div>


        <div class="player-controls">

            <button
                id="previous-btn"
                title="Previous song"
            >
                ⏮
            </button>

            <button
                id="play-pause-btn"
                title="Play/Pause"
            >
                ▶
            </button>

            <button
                id="next-btn"
                title="Next song"
            >
                ⏭
            </button>

        </div>


        <div class="volume">
            🔊
        </div>

    </footer>


    <!-- JavaScript -->

    <script src="js/auth.js"></script>

    <script src="dashboard.js"></script>

</body>

</html>
