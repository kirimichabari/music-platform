    <h1>All Songs</h1>

    <form id="song-form">

        <input type="text" id="title" placeholder="Song Title" required>

        <input type="number" id="duration" placeholder="Duration" required>

        <input type="date" id="release_date" required>

        <select id="artist_id" required>
    <option value="">Select Artist</option>
</select>

<select id="album_id" required>
    <option value="">Select Album</option>
</select>

        <button type="submit" id="submit-btn">Add Song</button>

    </form>
